<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gimnasio FitLife - Inicio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- FALLO 1 corregido: estructura semántica -->
    <header id="cabecera">
        <!-- FALLO 2 corregido: jerarquía de encabezados -->
        <h1>Gimnasio FitLife</h1>
        <h2>Tu centro de entrenamiento en la ciudad</h2>

        <nav class="menu">
            <a href="#contacto">Para inscribirte, haz clic aquí</a>
        </nav>
    </header>

    <main id="contenido">
        <!-- FALLO 3 corregido: texto alternativo de la imagen -->
        <img src="gimnasio.jpg" class="banner-img" alt="Instalaciones del gimnasio FitLife">

        <h2>Nuestros Servicios</h2>
        <p class="texto-secundario">Clases colectivas, sala de musculación y asesoramiento.</p>

        <section id="contacto">
            <h2>Solicita Información</h2>

            <form>
                <!-- FALLO 4 corregido: etiquetas vinculadas a los campos -->
                <label for="nombre">Nombre:</label>
                <input id="nombre" name="nombre" type="text" placeholder="Escribe tu nombre aquí...">

                <label for="email">Correo electrónico:</label>
                <input id="email" name="email" type="email" placeholder="Escribe tu email...">

                <!-- FALLO 5 corregido: botón HTML real -->
                <button class="boton-enviar" type="submit">Enviar Solicitud</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Gimnasio FitLife</p>
    </footer>
</body>
</html>
